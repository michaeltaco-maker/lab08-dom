<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 500px; }
    .error { color: red; font-size: 0.9em; display: none; }
    .completada { text-decoration: line-through; color: gray; }
    ul { list-style: none; padding: 0; }
    li { margin: 8px 0; display: flex; align-items: center; justify-content: space-between; }
    button.borrar { background-color: #ff4d4d; color: white; border: none; padding: 4px 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Gestor de Tareas</h2>
  
  <form id="formTarea">
    <input type="text" id="inputTitulo" placeholder="Título de la tarea...">
    <input type="text" id="inputCategoria" placeholder="Categoría...">
    <button type="submit">Agregar</button>
  </form>
  <p id="mensajeError" class="error">El título de la tarea no puede estar vacío.</p>

  <p>Filtro rápido: <input type="text" id="inputFiltro" placeholder="Filtrar por texto..."></p>

  <h3>Mis Tareas (<span id="contador">0</span>)</h3>
  <ul id="listaTareas"></ul>

  <script src="app.js"></script>
</body>
</html>
